specVersion: 1.3.0
description: BRB multi-market
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - name: BRBToken
    kind: ethereum/contract
    network: arbitrum-one
    source:
      abi: BRB
      address: "0x58871cf545f8f0df790443492a80edc414df4504"
      startBlock: 515103224
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - GlobalState
        - GlobalRound
        - Market
        - BRBTransfer
        - BRBBurn
        - User
        - UserMarketStats
        - WithdrawTransaction
        - JackpotPayout
        - PayoutTransaction
        - RouletteRound
        - RouletteBet
        - RoulettePlacement
        - DailyStat
        - TokenApproval
      abis:
        - name: BRB
          file: ./abis/BRB.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
      file: ./src/mappings/brb.ts
