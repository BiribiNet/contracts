        - GlobalRound
        - Market
        - BankAddress
        - RouletteRound
        - RouletteBet
        - PayoutTransaction
        - User
        - UserMarketStats
        - ContractRole
        - RoleHolder
        - ContractUpgrade
        - DailyStat
      abis:
        - name: Game
          file: ./abis/Game.json
        - name: BankVault4626
          file: ./abis/BankVault4626.json
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
