name: Read-only preflight tests
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && yarn install --immutable
      - run: node --test scripts/protocol-preflight.test.mjs scripts/export-mainnet-abis.test.mjs scripts/release-manifest.test.mjs scripts/incident20261104-execution.test.cjs scripts/update-frontend-abis.test.mjs scripts/mask-bets-v1-mainnet.test.cjs scripts/mask-bets-usage-report.test.cjs
