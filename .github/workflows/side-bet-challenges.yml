name: SideBet compatibility and challenge rules
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && yarn install --immutable
      - run: yarn hardhat test test/SideBet.test.ts test/SideBetChallenges.test.ts test/SideBetWindowChallenges.test.ts test/SideBetFunky.test.ts test/WindowChallengePricing.test.ts test/SideBetEconomics.test.ts test/SideBetCatalogue.test.ts test/SideBetX100Catalogue.test.ts test/SideBetCompatibilityArtifact.test.ts
      - run: yarn typecheck:side-bet-economics
